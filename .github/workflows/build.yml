name: Build Note 5 Kernel with BakaSU

on:
  push:
    branches:
      - bakasu-sm-n920c
    paths:
      - '.github/workflows/build.yml'
      - 'arch/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
      - 'kernel/**'
      - 'security/**'
      - 'Makefile'
      - 'Kconfig'
  workflow_dispatch:
    inputs:
      defconfig:
        description: Kernel defconfig
        required: true
        default: exynos7420-noblelte_defconfig

concurrency:
  group: bakasu-note5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev bc bison flex \
            libncurses5-dev libtinfo5 libelf-dev zip git python3 ccache

      - name: Install pinned AOSP GCC 4.9 toolchain
        run: |
          git clone --depth=1 -b android-10.0.0_r47 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$GITHUB_WORKSPACE/toolchain-arm64"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-aarch64-gcc49-${{ hashFiles('arch/arm64/configs/exynos7420-noblelte_defconfig') }}
          restore-keys: |
            ${{ runner.os }}-ccache-aarch64-gcc49-

      - name: Install pinned BakaSU source
        env:
          BAKASU_COMMIT: 516d3e87fbc986ccefdde2c2765f1700612441a9
        run: |
          rm -rf drivers/kernelsu KernelSU
          git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          git -C KernelSU checkout --detach "$BAKASU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$BAKASU_COMMIT"
          # Linux 3.10 UAPI headers lack asm/fcntl.h needed by BakaSU's
          # embedded preinit runner. Disable only that optional component;
          # do not replace the missing runner with a fake binary.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("KernelSU/kernel/tools/code_generation/code_generation.mk")
          s = p.read_text()
          needle = "include $(KSU_SRC)/tools/code_generation/preinit_runner/preinit_runner.mk"
          assert s.count(needle) == 1
          s = s.replace(needle, "ccflags-y += -DKSU_NO_PREINIT\n# preinit runner disabled on this legacy Linux 3.10 kernel")
          p.write_text(s)
          PY
          ln -s ../KernelSU/kernel drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          echo "Using BakaSU $BAKASU_COMMIT"

      - name: Configure kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: ccache ${{ github.workspace }}/toolchain-arm64/bin/aarch64-linux-android-
          DEFCONFIG: ${{ github.event.inputs.defconfig || 'exynos7420-noblelte_defconfig' }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPRESS: 1
        run: |
          make mrproper
          make "$DEFCONFIG"
          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KSU_MANUAL_HOOK
          scripts/config --enable CONFIG_KALLSYMS_ALL
          scripts/config --disable CONFIG_KSU_TRACEPOINT_HOOK
          scripts/config --disable CONFIG_KSU_SUSFS
          # Samsung's optional booster needs a proprietary secos_booster.h
          # which is absent from this source tree.
          scripts/config --disable CONFIG_SECURE_OS_BOOSTER_API
          make olddefconfig
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS_ALL=)' .config

      - name: Build kernel and device trees
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: ccache ${{ github.workspace }}/toolchain-arm64/bin/aarch64-linux-android-
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPRESS: 1
        run: |
          ccache --show-stats
          make -j"$(nproc)" Image dtbs
          test -s arch/arm64/boot/Image
          find arch/arm64/boot/dts -type f -name '*.dtb' -print

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          git -C anykernel checkout --detach 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
          sed -i \
            -e 's/kernel.string=ExampleKernel by osm0sis @ xda-developers/kernel.string=BakaSU Note 5 universal7420/' \
            -e 's/device.name1=maguro/device.name1=nobleltedv/' \
            -e 's/device.name2=toro/device.name2=/' \
            -e 's/device.name3=toroplus/device.name3=/' \
            -e 's/device.name4=tuna/device.name4=/' \
            -e 's/^BLOCK=.*/BLOCK=\/dev\/block\/platform\/15570000.ufs\/by-name\/BOOT;/' \
            -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' anykernel/anykernel.sh
          # The pinned AnyKernel template is for Galaxy Nexus (tuna). Remove
          # its unrelated init.tuna.rc and fstab.tuna modifications entirely.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("anykernel/anykernel.sh")
          s = p.read_text()
          # Strip the template's unrelated init.rc tweaks as well as its
          # Galaxy Nexus init.tuna.rc/fstab.tuna edits.
          import re
          s = re.sub(r"(?m)^# init\.rc\n.*?(?=^write_boot;)", "", s, flags=re.S)
          start = s.index("# init.tuna.rc")
          end = s.index("write_boot;", start)
          s = s[:start] + "# Note 5: retain the stock ramdisk and fstab unchanged." + chr(10) + chr(10) + s[end:]
          assert "init.tuna.rc" not in s and "fstab.tuna" not in s
          assert "backup_file init.rc" not in s and "replace_string init.rc" not in s
          assert "write_boot;" in s
          assert "device.name1=nobleltedv" in s
          assert "BLOCK=/dev/block/platform/15570000.ufs/by-name/BOOT;" in s
          p.write_text(s)
          PY
          cp arch/arm64/boot/Image anykernel/Image
          DTB_FILE="$(find arch/arm64/boot/dts -type f -name '*noblelte*.dtb' | sort | head -n 1)"
          if [ -n "$DTB_FILE" ]; then
            cat "$DTB_FILE" >> anykernel/Image
          else
            echo "No Note 5 DTB found; refusing to package an unverified image" >&2
            exit 1
          fi
          cd anykernel
          zip -r9 ../BakaSU-Kernel-Note5-universal7420.zip . \
            -x '.git/*' 'README.md' '*placeholder*'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-Kernel-Note5-universal7420
          path: BakaSU-Kernel-Note5-universal7420.zip
          retention-days: 7
