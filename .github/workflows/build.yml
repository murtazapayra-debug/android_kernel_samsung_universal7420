name: Build Note 5 Kernel with BakaSU

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel Defconfig'
        required: true
        default: 'exynos7420-noblelte_defconfig'
  push:
    branches:
      - murtazapayra_note5

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            bc \
            bison \
            flex \
            libncurses5-dev \
            libtinfo5 \
            libelf-dev \
            zip \
            tar \
            curl \
            git

      - name: Download AOSP GCC 4.9 Toolchain
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-10.0.0_r47 --depth=1 $GITHUB_WORKSPACE/toolchain-arm64

      - name: Setup KernelSU / LSM compatibility
        run: |
          if [ ! -d "drivers/kernelsu" ]; then
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main
          fi

          mkdir -p include/linux
          printf '%s\n' \
            '#ifndef _LINUX_LSM_HOOKS_H' \
            '#define _LINUX_LSM_HOOKS_H' \
            '#include <linux/security.h>' \
            '#include <linux/version.h>' \
            '#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 2, 0)' \
            'struct security_hook_list {' \
            '    struct list_head list;' \
            '    struct list_head *head;' \
            '    union { void *hook; } hook;' \
            '    char *lsm;' \
            '};' \
            '#ifndef LSM_HOOK_INIT' \
            '#define LSM_HOOK_INIT(HEAD, HOOK) { .hook = { .hook = (void *)(HOOK) } }' \
            '#endif' \
            'static inline void security_add_hooks(struct security_hook_list *hooks, ...) { (void)hooks; }' \
            'static inline void security_delete_hooks(struct security_hook_list *hooks, ...) { (void)hooks; }' \
            '#endif' \
            '#endif' > include/linux/lsm_hooks.h

      - name: Configure and Compile Kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: ${{ github.workspace }}/toolchain-arm64/bin/aarch64-linux-android-
          DEFCONFIG: ${{ github.event.inputs.defconfig || 'exynos7420-noblelte_defconfig' }}
        run: |
          make clean && make mrproper

          # Generate base configuration
          make $DEFCONFIG

          # Enforce BakaSU and disable Knox/TIMA/DEFEX/Booster
          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KSU_MANUAL_HOOK
          scripts/config --disable CONFIG_KSU_DEBUG
          scripts/config --enable CONFIG_OVERLAY_FS
          scripts/config --disable CONFIG_SECURITY_DEFEX
          scripts/config --disable CONFIG_TIMA
          scripts/config --disable CONFIG_TIMA_LKMAUTH
          scripts/config --disable CONFIG_UH_RKP
          scripts/config --disable CONFIG_KNOX_KAP
          scripts/config --disable CONFIG_SECURITY_SELINUX_POLICYAUTH
          scripts/config --disable CONFIG_DM_VERITY
          scripts/config --disable CONFIG_SEC_OS_BOOSTER

          # Bypass missing secos_booster module
          sed -i 's/.*sec-os-booster.*/# disabled/g' drivers/gud/gud-exynos7420/Makefile 2>/dev/null || true

          # Non-interactively apply defaults
          make olddefconfig || (yes "" | make oldconfig)

          # Build kernel image and device trees
          make -j$(nproc)

          # Verify compilation output
          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "Build failed: arch/arm64/boot/Image not generated!"
            exit 1
          fi

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel

          sed -i 's/device.name1=.*/device.name1=noblelte/g' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=noblelteeur/g' anykernel/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=universal7420/g' anykernel/anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/platform\/15570000.ufs\/by-name\/BOOT/g' anykernel/anykernel.sh
          sed -i 's/is_slot_device=1/is_slot_device=0/g' anykernel/anykernel.sh

          DTB_FILE=$(find arch/arm64/boot/dts/ -name "*noblelte*.dtb" 2>/dev/null | head -n 1)
          if [ -n "$DTB_FILE" ] && [ -f "$DTB_FILE" ]; then
            echo "Appending DTB: $DTB_FILE"
            cat arch/arm64/boot/Image "$DTB_FILE" > anykernel/Image
          else
            echo "Using standalone Image"
            cp arch/arm64/boot/Image anykernel/Image
          fi

          cd anykernel
          zip -r9 ../BakaSU-Kernel-Note5-universal7420.zip * -x .git ".git/*" README.md "*placeholder"

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-Kernel-Note5-universal7420
          path: BakaSU-Kernel-Note5-universal7420.zip
          retention-days: 7
