name: Build Note 5 Kernel with BakaSU

on:
  push:
    branches:
      - bakasu-sm-n920c
    paths:
      - '.github/workflows/build.yml'
      - 'arch/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
      - 'kernel/**'
      - 'security/**'
      - 'Makefile'
      - 'Kconfig'
  workflow_dispatch:
    inputs:
      defconfig:
        description: Kernel defconfig
        required: true
        default: exynos7420-noblelte_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev bc bison flex \
            libncurses5-dev libtinfo5 libelf-dev zip git python3

      - name: Install pinned AOSP GCC 4.9 toolchain
        run: |
          git clone --depth=1 -b android-10.0.0_r47 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$GITHUB_WORKSPACE/toolchain-arm64"

      - name: Install pinned BakaSU source
        env:
          BAKASU_COMMIT: 516d3e87fbc986ccefdde2c2765f1700612441a9
        run: |
          rm -rf drivers/kernelsu KernelSU
          git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          git -C KernelSU checkout --detach "$BAKASU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$BAKASU_COMMIT"
          ln -s ../KernelSU/kernel drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          echo "Using BakaSU $BAKASU_COMMIT"

      - name: Configure kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: ${{ github.workspace }}/toolchain-arm64/bin/aarch64-linux-android-
          DEFCONFIG: ${{ github.event.inputs.defconfig || 'exynos7420-noblelte_defconfig' }}
        run: |
          make mrproper
          make "$DEFCONFIG"
          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KSU_MANUAL_HOOK
          scripts/config --enable CONFIG_KALLSYMS_ALL
          scripts/config --disable CONFIG_KSU_TRACEPOINT_HOOK
          scripts/config --disable CONFIG_KSU_SUSFS
          make olddefconfig
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KALLSYMS_ALL=)' .config

      - name: Build kernel and device trees
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: ${{ github.workspace }}/toolchain-arm64/bin/aarch64-linux-android-
        run: |
          make -j"$(nproc)"
          test -s arch/arm64/boot/Image
          find arch/arm64/boot/dts -type f -name '*.dtb' -print

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp arch/arm64/boot/Image anykernel/Image
          DTB_FILE="$(find arch/arm64/boot/dts -type f -name '*noblelte*.dtb' | sort | head -n 1)"
          if [ -n "$DTB_FILE" ]; then
            cat "$DTB_FILE" >> anykernel/Image
          else
            echo "No Note 5 DTB found; refusing to package an unverified image" >&2
            exit 1
          fi
          cd anykernel
          zip -r9 ../BakaSU-Kernel-Note5-universal7420.zip . \
            -x '.git/*' 'README.md' '*placeholder*'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-Kernel-Note5-universal7420
          path: BakaSU-Kernel-Note5-universal7420.zip
          retention-days: 7
